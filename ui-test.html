<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Todo API UI Test</title>
  <style>
    :root {
      color-scheme: dark;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: #0b1020;
      color: #e7ecff;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .panel {
      width: min(760px, 100%);
      background: #121a33;
      border: 1px solid #2a3768;
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin-top: 0;
      font-size: 1.4rem;
      letter-spacing: 0.3px;
    }

    .muted {
      margin-top: -4px;
      color: #a5b2df;
      font-size: 0.95rem;
    }

    .row {
      display: grid;
      gap: 10px;
      margin: 14px 0;
    }

    input,
    textarea,
    button {
      font: inherit;
      border-radius: 10px;
      border: 1px solid #2b3d76;
      background: #0f1730;
      color: #e7ecff;
      padding: 10px 12px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    button {
      cursor: pointer;
      background: #2849b8;
      border-color: #4a69d1;
      font-weight: 600;
    }

    button:hover {
      background: #3156d0;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    pre {
      margin: 10px 0 0;
      border-radius: 10px;
      padding: 12px;
      background: #060c1f;
      border: 1px solid #2b3d76;
      overflow: auto;
      min-height: 160px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <main class="panel">
    <h1>Todo Backend UI Test</h1>
    <p class="muted">Tests <code>GET /api/todos</code> and <code>POST /api/todos</code>.</p>

    <div class="grid">
      <button id="btn-get" type="button">GET /api/todos</button>
      <button id="btn-clear" type="button">Clear Response</button>
    </div>

    <div class="row">
      <input id="title" placeholder="Todo title" />
      <textarea id="description" placeholder="Todo description (optional)"></textarea>
      <button id="btn-create" type="button">POST /api/todos</button>
    </div>

    <pre id="output">Waiting for request...</pre>
  </main>

  <script>
    const API_BASE = "http://127.0.0.1:8080/api";
    const output = document.getElementById("output");

    function show(data) {
      output.textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);
    }

    async function parseBody(response) {
      const contentType = response.headers.get("content-type") || "";
      if (contentType.includes("application/json")) {
        return response.json();
      }
      return response.text();
    }

    document.getElementById("btn-get").addEventListener("click", async () => {
      show("Loading GET /api/todos...");
      try {
        const response = await fetch(`${API_BASE}/todos`);
        const body = await parseBody(response);
        show({ status: response.status, body });
      } catch (error) {
        show(`Request failed: ${error.message}`);
      }
    });

    document.getElementById("btn-create").addEventListener("click", async () => {
      const title = document.getElementById("title").value.trim();
      const descriptionRaw = document.getElementById("description").value.trim();

      if (!title) {
        show("Title is required before creating a todo.");
        return;
      }

      const payload = {
        title,
        description: descriptionRaw.length > 0 ? descriptionRaw : null
      };

      show("Loading POST /api/todos...");
      try {
        const response = await fetch(`${API_BASE}/todos`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        const body = await parseBody(response);
        show({ status: response.status, body });
      } catch (error) {
        show(`Request failed: ${error.message}`);
      }
    });

    document.getElementById("btn-clear").addEventListener("click", () => {
      show("Waiting for request...");
    });
  </script>
</body>
</html>
